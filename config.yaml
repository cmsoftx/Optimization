# ---------------------------------------------------------------------------
# Project configuration.
# Sections are added phase by phase. Every value under a `simulation:` key is
# a documented business ASSUMPTION, not a dataset value.
# ---------------------------------------------------------------------------

project:
  name: "Demand-Driven E-Commerce Warehouse Location and Multi-Vehicle Routing"
  random_seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: data/outputs
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures

dataset:
  kaggle_ref: shashwatwork/dataco-smart-supply-chain-for-big-data-analysis
  main_file: DataCoSupplyChainDataset.csv
  description_file: DescriptionDataCoSupplyChain.csv
  access_log_file: tokenized_access_logs.csv
  encoding: latin-1            # file is ISO-8859-1, not UTF-8
  date_format: "%m/%d/%Y %H:%M"
  # Columns holding personal data. Never written to processed outputs.
  pii_columns:
    - Customer Fname
    - Customer Lname
    - Customer Street
    - Customer Email
    - Customer Password

data_quality:
  # Coordinates are flagged when they are farther than this from the median
  # coordinate of the record's `Customer State` (robust, data-driven check).
  state_consistency_max_km: 1000
  # Tukey fences for univariate outlier screening.
  iqr_multiplier: 1.5

geography:
  # Approximate bounding boxes used for validity screening (degrees).
  conus_bbox:        {lat_min: 24.4, lat_max: 49.5, lon_min: -125.0, lon_max: -66.9}
  puerto_rico_bbox:  {lat_min: 17.8, lat_max: 18.6, lon_min: -67.3, lon_max: -65.2}
  hawaii_bbox:       {lat_min: 18.8, lat_max: 22.4, lon_min: -160.3, lon_max: -154.7}
  alaska_bbox:       {lat_min: 51.0, lat_max: 71.5, lon_min: -180.0, lon_max: -129.9}

# ---------------------------------------------------------------------------
# Phase 2: cleaning, network scope and demand zones
# ---------------------------------------------------------------------------
preprocessing:
  # Orders that never ship are not demand. In the raw data every CANCELED
  # and SUSPECTED_FRAUD order has Delivery Status = "Shipping canceled".
  non_demand_order_statuses: [CANCELED, SUSPECTED_FRAUD]
  # Columns removed from processed outputs, beyond the PII columns above.
  drop_columns:
    Product Description: "100% missing"
    Product Status: "constant (0 for every row)"
    Product Image: "URL only, no analytical content"
    Customer Zipcode: "quasi-identifier, not used (coordinates are used instead)"
    Order Zipcode: "86% missing; destination geography is not used"
  regime_break_date: "2017-10-01"   # detected in Phase 1 (units/month fall ~80%)
  # all: every valid order is demand at the customer coordinate (approved scope).
  # domestic_only: keep only orders whose Order Country is US or Puerto Rico.
  destination_scope: all
  domestic_destination_countries: [Estados Unidos, Puerto Rico]

networks:
  # Coordinate region -> logistics network. Regions not listed are excluded.
  CONUS:       {code: US, role: primary optimization network}
  Puerto Rico: {code: PR, role: separate island logistics network}
  Hawaii:      {code: HI, role: demand-analysis region only}

demand_zones:
  # Complete-linkage clustering of validated customer coordinates: every pair
  # of customers inside one zone is at most `max_diameter_km` apart.
  # These diameters are MODELLING CHOICES, not dataset values.
  max_diameter_km: {CONUS: 50, Puerto Rico: 10, Hawaii: 10}

validation:
  # Public, approximate city-centre coordinates used only to sanity-check how
  # the dataset's Latitude/Longitude should be interpreted. External reference.
  reference_cities:
    - {state: IL, city: Chicago,     lat: 41.8781, lon: -87.6298}
    - {state: CA, city: Los Angeles, lat: 34.0522, lon: -118.2437}
    - {state: NY, city: Brooklyn,    lat: 40.6782, lon: -73.9442}
    - {state: TX, city: Houston,     lat: 29.7604, lon: -95.3698}
    - {state: NY, city: New York,    lat: 40.7128, lon: -74.0060}
    - {state: PA, city: Philadelphia, lat: 39.9526, lon: -75.1652}
    - {state: CA, city: San Diego,   lat: 32.7157, lon: -117.1611}
    - {state: PR, city: San Juan,    lat: 18.4655, lon: -66.1057}
    - {state: PR, city: Caguas,      lat: 18.2341, lon: -66.0485}
    - {state: HI, city: Honolulu,    lat: 21.3069, lon: -157.8583}

# ---------------------------------------------------------------------------
# Phase 3: demand forecasting
# ---------------------------------------------------------------------------
forecasting:
  networks: [CONUS, Puerto Rico]   # Hawaii is analysis-only (approved scope)
  targets: [orders, units]
  primary_granularity: W
  granularity:
    W:   # weeks Sunday-Saturday, so the week of 2017-10-01 starts exactly at the break
      period_freq: W-SAT
      lags: [1, 2, 3, 4]
      windows: [4, 8, 13]
      warmup: 13                   # first periods without full feature history are dropped
      ma_candidates: [4, 8, 13]
      adapt_periods: 4             # post-break periods observed before the adapted forecast
    M:
      period_freq: M
      lags: [1, 2, 3]
      windows: [3, 6]
      warmup: 6
      ma_candidates: [3, 6]
      adapt_periods: 1
  # Chronological windows (period START dates, inclusive). Train = everything before validation.
  splits:
    pre_break:  {validation_start: "2017-01-01", test_start: "2017-06-01", test_end: "2017-09-30"}
    post_break: {validation_start: "2017-06-01", test_start: "2017-10-01", test_end: "2018-01-31"}
  zone_tiers: {high: 0.10, medium: 0.40}   # top 10% / next 40% / bottom 50% by training orders
  random_forest_grid:
    - {max_depth: null, min_samples_leaf: 10, max_features: 0.5}
    - {max_depth: 12,   min_samples_leaf: 20, max_features: 0.5}
    - {max_depth: null, min_samples_leaf: 5,  max_features: sqrt}
    - {max_depth: 8,    min_samples_leaf: 20, max_features: 1.0}
  random_forest_trees: 300
  xgboost_grid:
    objective: ["reg:squarederror", "count:poisson"]
    max_depth: [3, 5]
    min_child_weight: [1, 10]
  xgboost_fixed: {learning_rate: 0.05, n_estimators: 2000, subsample: 0.8, colsample_bytree: 0.8,
                  reg_lambda: 1.0, reg_alpha: 0.0, early_stopping_rounds: 100}
  cflp_horizon_periods: 13         # forward forecast handed to the CFLP (one quarter)

# ---------------------------------------------------------------------------
# Phases 4-8: optimisation. EVERY value below is a SIMULATION ASSUMPTION
# (the dataset contains no warehouses, costs, capacities or fleet).
# Planning period = one week (demand inputs are weekly forecasts); annual = x52.
# ---------------------------------------------------------------------------
optimization:
  demand_file: data/outputs/cflp_zone_demand_forecast.csv
  demand_columns: {orders: forecast_per_period_orders, units: forecast_per_period_units}
  periods_per_year: 52
  distance:
    method: haversine_circuity     # OSRM is not reachable from this environment (see report)
    circuity_factor: 1.20          # road km ~ 1.2 x great-circle km (published US detour indices ~1.17-1.21)
  solver: {name: cbc, time_limit_s: 120, mip_rel_gap: 0.0001, unserved_penalty_per_unit: 10000}
  networks:
    CONUS:
      candidates: {coverage_clusters: 30, top_demand_zones: 10}
      min_warehouses: 1
      max_warehouses: 12
      capacity_units_per_week: 80          # handling/storage throughput per warehouse
      fixed_cost_per_week: 1500            # amortised opening + fixed operating cost (USD)
      cost_per_order_km: 0.10              # outbound delivery cost per order per road-km (USD)
      handling_cost_per_unit: 0.50         # uniform, so it does not change the optimal location
    Puerto Rico:
      candidates: {coverage_clusters: 25, top_demand_zones: 25}   # all 25 zones are candidates
      min_warehouses: 1
      max_warehouses: 4
      capacity_units_per_week: 100
      fixed_cost_per_week: 1200
      cost_per_order_km: 0.10
      handling_cost_per_unit: 0.50

genetic_algorithm:
  population_size: 60
  generations: 80
  crossover_probability: 0.8
  mutation_probability: 0.3        # probability an individual is mutated
  gene_flip_probability: null      # null -> 1 / chromosome length
  tournament_size: 3
  elite_size: 2
  patience: 25                     # stop early after this many generations without improvement
  seeds: [11, 22, 33, 44, 55]
  random_baseline_draws: 30

routing:
  # Weekly consolidated delivery plan: each demand-zone centroid is a delivery point
  # (e.g. a local parcel hub); one package = one order (no weights/volumes in the data).
  packages_per_order: 1
  service_time_min_per_stop: 10
  vehicle_cost_per_km: 1.0
  driver_cost_per_hour: 25.0
  time_limit_s_per_depot: 10        # Guided Local Search budget per depot
  networks:
    CONUS:       {vehicle_capacity_packages: 30, vehicles_per_depot: 8, speed_kmh: 65, max_route_km: 3000}
    Puerto Rico: {vehicle_capacity_packages: 30, vehicles_per_depot: 8, speed_kmh: 40, max_route_km: 400}

experiments:
  sensitivity:
    capacity_multipliers: [0.6, 0.8, 1.0, 1.5, 2.0, 3.0]
    fixed_warehouse_counts: [2, 3, 4, 5, 6, 7, 8, 10, 12]
    fixed_cost_multipliers: [0.25, 0.5, 1.0, 2.0, 4.0]
    cost_per_km_multipliers: [0.25, 0.5, 1.0, 2.0, 4.0]
    demand_growth: [-0.2, -0.1, 0.0, 0.1, 0.2, 0.4]
    vehicle_capacities: [15, 20, 30, 45, 60]
    vehicles_per_depot: [2, 3, 4, 6, 8]
    zone_diameters_km: [25, 50, 100]
  robustness_demand_changes: [-0.2, -0.1, 0.0, 0.1, 0.2]
